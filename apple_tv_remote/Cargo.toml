[package]
name = "apple-tv-remote"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Apple TV Siri Remote touchpad and Opus microphone daemon"

[[bin]]
name = "apple-tv-remote"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
audiopus = { version = "0.2", features = ["decoder"] }
clap = { version = "4.5", features = ["derive"] }
evdev = "0.13"
libc = "0.2"
pipewire = { version = "0.10", features = ["v0_3_33"] }
rtrb = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
tokio = { version = "1.44", features = ["rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.11", default-features = false, features = ["tokio"] }

[dev-dependencies]
# Tests encode packets with libopus so the decoder is exercised for real.
audiopus = { version = "0.2", features = ["encoder", "decoder"] }
tempfile = "3.19"
