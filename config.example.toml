[agents]
# Discover agents and deliver prompts/answers through Herdr terminal controls.
herdr_command = "herdr"
herdr_session = "default"
discover_remote = true # Include enabled machines saved in Herdr.
screen_lines = 30
poll_seconds = 2

[intent]
base_url = "https://api.openai.com/v1"
model = "gpt-5-mini"
api_key_env = "ORCHRD_API_KEY"
timeout_seconds = 60

[routing]
# Full System One decision API URL (`url` is also accepted).
endpoint = "http://127.0.0.1:8009/v1/systemone"
model = "kev-latest"
api_key = "" # Optional Bearer token; leave empty for an unauthenticated server.
timeout_seconds = 30

[voice]
announcement_mode = "muted"

[tts]
provider = "pocket" # Or "openai_compatible"; see README for [tts.api].
language = "english_2026-04"
model_config = "/home/you/.local/share/orchrd/pocket-tts/english_2026-04.yaml"
voice = "/home/you/.local/share/orchrd/pocket-tts/voice.safetensors"
quantize = true

[stt.api]
# An OpenAI-compatible audio transcription API root, including /v1 if needed.
base_url = "http://127.0.0.1:8000/v1"
model = "your-stt-model"
timeout_seconds = 60
