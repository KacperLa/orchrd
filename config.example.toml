[commands]
voxtype = "voxtype"

[intent]
base_url = "https://api.openai.com/v1"
model = "gpt-5-mini"
api_key_env = "ORCHRD_API_KEY"
timeout_seconds = 60

[routing]
# Full System One decision API URL (`url` is also accepted).
endpoint = "http://192.168.1.104:8009/v1/systemone"
model = "kev-latest"
api_key = "" # Optional Bearer token; leave empty for an unauthenticated server.
timeout_seconds = 30

[voice]
announcement_mode = "muted"
# Maximum wait for transcription after releasing push-to-talk.
transcription_timeout_seconds = 60

[tts]
provider = "pocket" # Or "openai_compatible"; see README for [tts.api].
language = "english_2026-04"
model_config = "/home/kacper/.local/share/orchrd/pocket-tts/english_2026-04.yaml"
voice = "/home/kacper/.local/share/orchrd/pocket-tts/alba.safetensors"
quantize = true

[stt]
provider = "voxtype" # Or "openai_compatible"; see README for [stt.api].
